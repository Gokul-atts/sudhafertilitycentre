name: Deploying changes to EC2 via Jumpbox (OIDC + Instance Connect)

'on':
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ephemeral]

    steps:
      - name: Check Teams webhook
        shell: bash
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          if [ -n "$TEAMS_WEBHOOK" ]; then
            echo "TEAMS_WEBHOOK is available"
          else
            echo "TEAMS_WEBHOOK is NOT available"
            exit 1
          fi

      - name: Teams - Workflow Started
        uses: atts-technologies/.github/.github/actions/teams-notification@main
        with:
          status: started
          webhook: ${{ secrets.TEAMS_WEBHOOK }}
      # Checkout (for workflow files only, not deployment)
      - name: Checkout code
        uses: actions/checkout@v4

      # AWS OIDC authentication
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN  }}
          aws-region: ${{ secrets.AWS_REGION }}

      # GitHub App token
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # Generate temporary SSH key
      - name: Generate ephemeral SSH key
        id: ssh-key
        shell: bash
        run: |
          set -euo pipefail

          # Create a unique temporary directory for this workflow run
          SSH_DIR=$(mktemp -d)
          SSH_KEY="$SSH_DIR/gh_key"

          chmod 700 "$SSH_DIR"

          echo "Generating ephemeral SSH key..."

          ssh-keygen \
            -t ed25519 \
            -f "$SSH_KEY" \
            -N "" \
            -q

          chmod 600 "$SSH_KEY"

          echo "ssh_dir=$SSH_DIR" >> "$GITHUB_OUTPUT"
          echo "ssh_key=$SSH_KEY" >> "$GITHUB_OUTPUT"

          echo "Ephemeral SSH key generated."

      # Push temporary key to jumpbox
      # (valid for ~60 seconds)
      - name: Inject SSH key into private EC2
        shell: bash
        run: |
          set -euo pipefail

          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "${{ secrets.JUMPBOX_INSTANCE_ID }}" \
            --availability-zone "${{ secrets.JUMPBOX_AZ }}" \
            --instance-os-user ubuntu \
            --ssh-public-key "file://${{ steps.ssh-key.outputs.ssh_key }}.pub"

      # Deploy via Jumpbox → Private EC2 (nested SSH)
      - name: Deploy via jumpbox (nested SSH)
        shell: bash
        run: |
          set -euo pipefail

          # Always remove the ephemeral SSH key when this step exits
          trap 'rm -rf "${{ steps.ssh-key.outputs.ssh_dir }}"' EXIT

          ssh -t \
            -i "${{ steps.ssh-key.outputs.ssh_key }}" \
            -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.JUMPBOX_HOST }} << 'JUMPBOX'

          echo "Connected to jumpbox: $(whoami)@$(hostname)"

          ssh \
            -i ~/bastion-server.pem \
            -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.TARGET_HOST }} << 'PRIVATE'

          set -euo pipefail
          echo "Connected to private EC2: $(whoami)@$(hostname)"
          echo "Deploy started at: $(date)"

          # Load Node environment
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          # Env variable setup
          export GITHUB_TOKEN="${{ steps.app-token.outputs.token }}"
          export REPO_NAME="${{ github.event.repository.name }}"

          cd /home/ubuntu/$REPO_NAME

          git checkout main
          git -c credential.helper='!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f' pull

          npm i
          npm run build
          pm2 reload $REPO_NAME

          PRIVATE
          JUMPBOX

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -rf "${{ steps.ssh-key.outputs.ssh_dir }}"

      - name: Teams - Workflow Completed
        if: always()
        uses: atts-technologies/.github/.github/actions/teams-notification@main
        with:
          status: ${{ job.status }}
          webhook: ${{ secrets.TEAMS_WEBHOOK }}
